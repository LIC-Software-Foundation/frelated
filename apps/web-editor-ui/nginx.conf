server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # PDF.js uses an ES module worker. nginx 1.27's default MIME table does not
  # declare .mjs, and browsers reject module workers served as octet-stream.
  location ~ \.mjs$ {
    default_type application/javascript;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
