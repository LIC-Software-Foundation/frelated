services:
  languagetool:
    image: silviof/docker-languagetool:latest
    restart: unless-stopped
    networks:
      - frelated-network
    ports:
      - '8010:8010'

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    networks:
      - frelated-network
    ports:
      - '1025:1025'
      - '8025:8025'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory-policy',
        'noeviction',
      ]
    networks:
      - frelated-network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  compilation-worker:
    build:
      context: .
      dockerfile: apps/compilation-worker/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE]
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
    tmpfs:
      - /tmp:size=384m,mode=1777
    networks:
      - frelated-network
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      COMPILATION_TIMEOUT_MS: ${COMPILATION_TIMEOUT_MS:-120000}

  compilation-autoscaler:
    build:
      context: .
      dockerfile: apps/compilation-autoscaler/Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - frelated-network
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      HOST: 0.0.0.0
      PORT: 3100
      REDIS_URL: redis://redis:6379
      COMPILATION_QUEUE_NAME: ${COMPILATION_QUEUE_NAME:-frelated-latex}
      HEAVY_JOB_PAYLOAD_THRESHOLD_MB: ${AUTOSCALER_HEAVY_JOB_PAYLOAD_THRESHOLD_MB:-3}
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      COMPILATION_WORKER_IMAGE: ${COMPILATION_WORKER_IMAGE:-frelated-compilation-worker}
      COMPILATION_WORKER_NETWORK: frelated-network
      AUTH_SECRET: ${AUTH_SECRET}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      COMPILATION_TIMEOUT_MS: ${COMPILATION_TIMEOUT_MS:-120000}
      POLL_INTERVAL_MS: ${AUTOSCALER_POLL_INTERVAL_MS:-5000}
      SCALE_UP_THRESHOLD: ${AUTOSCALER_SCALE_UP_THRESHOLD:-3}
      SCALE_DOWN_THRESHOLD: ${AUTOSCALER_SCALE_DOWN_THRESHOLD:-3}
      MIN_WORKERS: ${AUTOSCALER_MIN_WORKERS:-1}
      MAX_WORKERS: ${AUTOSCALER_MAX_WORKERS:-10}
      SCALE_COOLDOWN_MS: ${AUTOSCALER_SCALE_COOLDOWN_MS:-30000}
      ESTIMATED_WORKER_MEMORY_MB: ${AUTOSCALER_ESTIMATED_WORKER_MEMORY_MB:-320}
      MIN_FREE_MEMORY_AFTER_SCALE_UP_MB: ${AUTOSCALER_MIN_FREE_MEMORY_AFTER_SCALE_UP_MB:-768}
      MAX_CPU_LOAD_FRACTION_AFTER_SCALE_UP: ${AUTOSCALER_MAX_CPU_LOAD_FRACTION_AFTER_SCALE_UP:-0.85}
      HEAVY_JOB_COUNT_THRESHOLD: ${AUTOSCALER_HEAVY_JOB_COUNT_THRESHOLD:-2}
      BUSY_WORKER_CPU_LOAD_THRESHOLD: ${AUTOSCALER_BUSY_WORKER_CPU_LOAD_THRESHOLD:-0.8}
    ports:
      - '${COMPILATION_AUTOSCALER_PORT:-3100}:3100'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3100/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    networks:
      - frelated-network
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    networks:
      - frelated-network
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    ports:
      - '${MONGO_PORT:-27017}:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "mongosh --quiet mongodb://127.0.0.1:27017/$${MONGO_INITDB_DATABASE} --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1 >/dev/null",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  projects-api:
    build:
      context: .
      dockerfile: apps/projects-api/Dockerfile
    restart: unless-stopped
    networks:
      - frelated-network
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      PERSISTENCE_DRIVER: ${PERSISTENCE_DRIVER:-mongodb}
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      MONGODB_URL: mongodb://mongodb:27017/${MONGO_DB_NAME}
      MONGODB_DB_NAME: ${MONGO_DB_NAME}
      AUTH_SECRET: ${AUTH_SECRET}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      COLLAB_SERVER_URL: http://collab-server:8080
      REDIS_URL: redis://redis:6379
      PRISMA_AUTO_MIGRATE: ${PRISMA_AUTO_MIGRATE:-true}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:5173}
      GUEST_INVITATION_TTL_HOURS: ${GUEST_INVITATION_TTL_HOURS:-168}
      PROJECT_MAX_GUEST_INVITATIONS: ${PROJECT_MAX_GUEST_INVITATIONS:-10}
      GUEST_SESSION_TTL_HOURS: ${GUEST_SESSION_TTL_HOURS:-12}
      PROJECT_JOIN_LINK_TTL_HOURS: ${PROJECT_JOIN_LINK_TTL_HOURS:-168}
      PROJECT_MAX_PARTICIPANTS: ${PROJECT_MAX_PARTICIPANTS:-0}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Frelated <no-reply@frelated.local>}
      PROOFREADING_PROVIDER: ${PROOFREADING_PROVIDER:-languagetool}
      LANGUAGETOOL_URL: ${LANGUAGETOOL_URL:-http://languagetool:8010/v2/check}
      LANGUAGETOOL_API_KEY: ${LANGUAGETOOL_API_KEY:-}
      PROOFREADING_DEFAULT_LANGUAGE: ${PROOFREADING_DEFAULT_LANGUAGE:-fr}
    ports:
      - '${PROJECTS_API_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ping').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  collab-server:
    build:
      context: .
      dockerfile: apps/collab-server/Dockerfile
    restart: unless-stopped
    networks:
      - frelated-network
    depends_on:
      projects-api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      HOST: 0.0.0.0
      AUTH_SECRET: ${AUTH_SECRET}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      PROJECTS_API_URL: http://projects-api:3000
      COLLAB_STORE_ROOT: /var/lib/frelated/collab-store
    ports:
      - '${COLLAB_SERVER_PORT:-8080}:8080'
    volumes:
      - collab_store:/var/lib/frelated/collab-store
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web-editor-ui:
    build:
      context: .
      dockerfile: apps/web-editor-ui/Dockerfile
      args:
        VITE_SERVICE_MODE: api
        VITE_PROJECTS_API_URL: ${PROJECTS_API_PUBLIC_URL:-http://localhost:3000}
        VITE_COLLAB_SERVER_URL: ${COLLAB_SERVER_PUBLIC_URL:-ws://localhost:8080}
    restart: unless-stopped
    networks:
      - frelated-network
    depends_on:
      projects-api:
        condition: service_healthy
      collab-server:
        condition: service_healthy
    ports:
      - '${WEB_EDITOR_UI_PORT:-5173}:80'

  web-monitoring-ui:
    build:
      context: .
      dockerfile: apps/web-monitoring-ui/Dockerfile
    restart: unless-stopped
    networks:
      - frelated-network
    ports:
      - '${WEB_MONITORING_UI_PORT:-5174}:80'

volumes:
  redis_data:
  mysql_data:
  mongo_data:
  collab_store:

networks:
  frelated-network:
    name: frelated-network
    driver: bridge
